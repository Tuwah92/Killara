
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Client Onboarding Form (Formspree + Signature)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: Arial, sans-serif; margin: 30px; max-width: 720px; }
  h2 { margin-top: 0; }
  label { font-weight: bold; display: block; margin-top: 14px; }
  input, textarea, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { padding: 12px; margin-top: 18px; width: 100%; font-size: 16px; }
  canvas { border: 1px solid #333; width: 100%; height: 160px; touch-action: none; border-radius: 6px; }
  .muted { color: #666; font-size: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<h2>Client Onboarding Form</h2>
<p class="muted">Demo using <strong>Formspree</strong> to email submissions without a server. Replace <code>YOUR_FORM_ID</code> below.</p>

<form id="clientForm">
  <div class="row">
    <div>
      <label for="firstName">First name</label>
      <input id="firstName" name="firstName" required />
    </div>
    <div>
      <label for="lastName">Last name</label>
      <input id="lastName" name="lastName" required />
    </div>
  </div>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required />

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" required />

  <label for="service">Service Required</label>
  <select id="service" name="service" required>
    <option value="">Select...</option>
    <option>Forklift Licence Training</option>
    <option>Order Picker Licence Training</option>
    <option>Manual Handling Training</option>
    <option>Other</option>
  </select>

  <label for="notes">Additional Notes</label>
  <textarea id="notes" name="notes" rows="4" placeholder="Any important details..."></textarea>

  <label>Signature</label>
  <canvas id="signaturePad"></canvas>
  <div class="actions">
    <button type="button" id="clearSig">Clear Signature</button>
    <button type="button" id="undoSig">Undo Stroke</button>
  </div>

  <button type="submit">Submit</button>
</form>

<p class="muted">In your Formspree dashboard, you'll see submissions with the signature image attached.</p>

<script>
/* ==== Signature Pad (same as other demo) ==== */
const canvas = document.getElementById("signaturePad");
const ctx = canvas.getContext("2d");
let drawing = false;
let strokes = [];
let currentStroke = [];

function resizeCanvas() {
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  canvas.width = w * ratio;
  canvas.height = h * ratio;
  ctx.scale(ratio, ratio);
}
resizeCanvas();
window.addEventListener("resize", () => {
  const saved = strokes.slice();
  resizeCanvas();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  redraw(saved);
});

function getPos(e) {
  if (e.touches && e.touches.length) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }
  return { x: e.offsetX, y: e.offsetY };
}

function startDraw(e) {
  drawing = true;
  currentStroke = [];
  const p = getPos(e);
  currentStroke.push(p);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}
function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  currentStroke.push(p);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}
function endDraw() {
  if (!drawing) return;
  drawing = false;
  strokes.push(currentStroke);
  ctx.beginPath();
}
function clearPad() {
  strokes = [];
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function undoPad() {
  strokes.pop();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  redraw(strokes);
}
function redraw(strokesArr) {
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  strokesArr.forEach(stroke => {
    if (stroke.length) {
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }
      ctx.stroke();
    }
  });
}

/* ==== Formspree submit (replace YOUR_FORM_ID) ==== */
const FORMSPREE_ID = "xdkplqbo"; // e.g. "xwkgqyle"
const FORMSPREE_ENDPOINT = `https://formspree.io/f/${FORMSPREE_ID}`;

document.getElementById("clientForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  // Turn signature into a Blob (PNG)
  const dataUrl = canvas.toDataURL("image/png");
  const res = await fetch(dataUrl);
  const sigBlob = await res.blob();

  const formData = new FormData(this);
  formData.append("signature", sigBlob, "signature.png");

  if (strokes.length === 0) {
    if (!confirm("No signature detected. Submit anyway?")) return;
  }

  try {
    const resp = await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      body: formData,
      headers: { "Accept": "application/json" }
    });
    if (resp.ok) {
      alert("Submitted! Check your email/Formspree inbox.");
      this.reset();
      clearPad();
    } else {
      const err = await resp.json();
      alert("Formspree error: " + JSON.stringify(err));
    }
  } catch (err) {
    console.error(err);
    alert("Network error while submitting to Formspree.");
  }
});
</script>
</body>
</html>
